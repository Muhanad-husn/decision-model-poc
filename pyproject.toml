[project]
name = "decision-model-poc"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "typesafe-sdk==0.7.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
